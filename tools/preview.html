<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>preview</title>
  <link rel="stylesheet" href="../styles.css">
  <style> html, body { margin: 0; padding: 0; width: 640px; overflow: hidden; } </style>
</head>
<body>
  <script>
    // Renders one widget at 640 px for tools/make-previews.py: tools/preview.html?w=of-id
    const id = new URLSearchParams(location.search).get('w');
    const s = document.createElement('script'); s.src = `../widgets/${id}/component.js`;
    s.onload = () => { const el = document.createElement(id); el.setAttribute('lang', 'en'); document.body.appendChild(el); };
    document.head.appendChild(s);
  </script>
</body>
</html>
